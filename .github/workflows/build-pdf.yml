name: Build LaTeX PDF

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v4   # version récente et maintenue
        with:
          root_file: instructions.tex             # ← change si ton fichier principal s'appelle autrement
          # working_directory: ./latex    # si tes .tex sont dans un sous-dossier
          # compiler: latexmk             # par défaut c'est latexmk (le meilleur)
          # args: -pdf -synctex=1 -interaction=nonstopmode  # options supplémentaires si besoin

      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF
          path: main.pdf                  # ou le nom de ton PDF généré
